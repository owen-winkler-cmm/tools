<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title><!--TITLE--></title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.6}
.wrap{max-width:960px;margin:0 auto;padding:32px 20px}
header{margin-bottom:28px}
h1{font-size:1.7rem;font-weight:700;color:#0f172a;letter-spacing:-.02em}
.tagline{margin-top:6px;color:#64748b;font-size:.93rem}
.tagline a{color:#3b82f6;text-decoration:none}
.tagline a:hover{text-decoration:underline}
.card{background:#fff;border-radius:12px;padding:24px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
h2{font-size:1.05rem;font-weight:600;color:#0f172a;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid #f1f5f9}
.metrics-row{display:flex;gap:32px;flex-wrap:wrap;font-size:.9rem;color:#475569}
.metrics-row strong{color:#0f172a}
.chart-wrap{margin-top:20px}
.eng-block{padding:14px 0;border-bottom:1px solid #f1f5f9}
.eng-block:last-child{border-bottom:none;padding-bottom:0}
.eng-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.eng-name{font-weight:600;color:#0f172a;font-size:.97rem}
.eng-count{color:#64748b;font-size:.85rem}
.wip-badge{padding:2px 9px;border-radius:99px;font-size:.75rem;font-weight:600;text-decoration:none}
.wip-badge.critical{background:#fee2e2;color:#991b1b}
.wip-badge.concern{background:#fef3c7;color:#92400e}
.pto-tag{background:#ede9fe;color:#5b21b6;padding:2px 8px;border-radius:99px;font-size:.75rem;font-weight:600}
.pto-tag.upcoming{background:#e0f2fe;color:#0369a1}
.pto-tag.partial{background:#fef9c3;color:#854d0e}
.avail-note{color:#64748b;font-size:.88rem}
a.card-key{font-weight:600;color:#3b82f6;text-decoration:none;white-space:nowrap;font-size:.85rem}
a.card-key:hover{text-decoration:underline}
.card-list{list-style:none;padding-left:4px}
.card-list li{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;padding:4px 0;font-size:.88rem}
.card-title{color:#374151}
.card-status{font-weight:600;color:#0f172a;white-space:nowrap}
.card-age{color:#64748b;white-space:nowrap}
.card-pts{background:#eef2ff;color:#4338ca;padding:1px 7px;border-radius:99px;font-size:.72rem;font-weight:600;white-space:nowrap}
.card-age.over-sle{color:#ef4444;font-weight:700}
.av-list{list-style:none}
.av-list li{padding:7px 0;border-bottom:1px solid #f1f5f9;color:#374151;font-size:.9rem}
.av-list li:last-child{border-bottom:none}
.ev-note{color:#64748b;font-size:.85rem}
.empty-note,.recs-placeholder{color:#94a3b8;font-style:italic;font-size:.9rem}
#wip-tip{position:fixed;display:none;background:#1e293b;color:#f8fafc;padding:10px 14px;border-radius:8px;font-size:12.5px;max-width:300px;pointer-events:none;z-index:9999;line-height:1.55;box-shadow:0 4px 20px rgba(0,0,0,.35)}
#wip-tip .tk{font-weight:700;font-size:13px}
#wip-tip .td{margin-top:2px;color:#94a3b8;font-size:11px}
#wip-tip .tl{margin-top:8px;pointer-events:auto}
#wip-tip .tl a{color:#60a5fa;text-decoration:none;font-weight:600}
#wip-tip .tl a:hover{text-decoration:underline}
#recs-content h3{font-size:.97rem;font-weight:600;color:#0f172a;margin:20px 0 8px}
#recs-content h3:first-child{margin-top:0}
#recs-content p{margin-bottom:10px;color:#374151;font-size:.9rem}
#recs-content ul,#recs-content ol{padding-left:20px;margin:0 0 14px;font-size:.9rem;color:#374151}
#recs-content li{margin-bottom:6px;line-height:1.5}
#recs-content a{color:#3b82f6;text-decoration:none}
#recs-content a:hover{text-decoration:underline}
.pr-info{color:#94a3b8;font-size:.8rem}
.pr-missing{color:#f97316}
.pr-not-needed{color:#16a34a;font-weight:500}
.pr-link{color:#60a5fa;text-decoration:none}
.pr-link:hover{text-decoration:underline}
.pr-approved{color:#22c55e;font-weight:600}
.pr-changes-requested{color:#ef4444;font-weight:600}
.pr-review-required{color:#f59e0b;font-weight:600}
#nd-tip{position:fixed;display:none;background:#1e293b;color:#f8fafc;padding:10px 14px;border-radius:8px;font-size:12.5px;max-width:280px;pointer-events:none;z-index:9999;line-height:1.55;box-shadow:0 4px 20px rgba(0,0,0,.35)}
#nd-tip .nd-desc{color:#cbd5e1;font-size:12px}
.nd-label{border-bottom:1px dashed currentColor;text-decoration:none!important}
.nd-label:hover{opacity:.85}
/* Sprint banner (header) */
.sprint-banner{margin-top:14px;padding:14px 16px;background:#eef2ff;border:1px solid #e0e7ff;border-radius:10px}
.sprint-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sprint-name{font-weight:700;color:#3730a3;font-size:1rem}
.sprint-day{color:#6366f1;font-size:.85rem;font-weight:600}
.sprint-goal{margin-top:6px;color:#374151;font-size:.9rem;line-height:1.5}
.sprint-progress{margin-top:10px}
.sprint-bar{height:8px;background:#e0e7ff;border-radius:99px;overflow:hidden}
.sprint-bar span{display:block;height:100%;background:#6366f1;border-radius:99px}
.sprint-prog-label{margin-top:4px;color:#4f46e5;font-size:.8rem;font-weight:600}
/* Stacked metric panels: full-width aging-WIP board, burndown underneath */
.metrics-grid{display:flex;flex-direction:column;gap:20px;margin-bottom:20px}
.metrics-grid .metrics-panel{margin-bottom:0}
/* Team-status + straggler extras */
.done-chip{background:#dcfce7;color:#166534;padding:2px 8px;border-radius:99px;font-size:.75rem;font-weight:600}
.not-in-sprint{background:#fef3c7;color:#92400e;padding:1px 7px;border-radius:99px;font-size:.72rem;font-weight:600;white-space:nowrap}
.card-sub{font-weight:400;color:#94a3b8;font-size:.82rem}
.straggler-list{list-style:none}
.straggler-list li{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:.88rem}
.straggler-list li:last-child{border-bottom:none}
.straggler-owner{color:#64748b;font-size:.82rem;margin-left:auto}
</style>
</head>
<body>
<div class="wrap">
<header id="report-header"><!--HEADER--></header>

<div class="metrics-grid">
<div class="card metrics-panel" id="flow-metrics-card"><h2>Flow Metrics</h2><div id="flow-metrics"><!--METRICS--></div></div>
<div class="card metrics-panel" id="sprint-metrics-card"><h2>Sprint</h2><div id="sprint-metrics"><!--SPRINT--></div></div>
</div>

<div class="card" id="team-status-card"><h2>Team Status</h2><div id="team-status"><!--TEAM--></div></div>

<!--STRAGGLERS-->

<div class="card" id="recommendations"><h2>Recommendations</h2><div id="recs-content"><!--RECOMMENDATIONS--></div></div>

<div class="card" id="availability-card"><h2>Availability and Upcoming Events</h2><div id="availability"><!--AVAILABILITY--></div></div>
</div>
<div id="wip-tip"></div><div id="nd-tip"><div class="nd-desc"></div></div>

<script>
(function() {
  // Hover-card tooltip machinery only -- everything else on this page is already rendered
  // server-side into plain HTML with data-* attributes attached, so there's no fetch, no
  // template engine, and no CDN dependency. This file works fully offline via file://.
  const tip = document.getElementById('wip-tip');
  let pinned = false, pk = null;
  function showTip(el) {
    const d = el.dataset;
    const title = d.title || d.key || '';
    const meta = d.meta || [d.name, d.days ? d.days + 'd' : null, d.status].filter(Boolean).join(' · ');
    let h = '<div class="tk">' + title + '</div>';
    if (d.summary) h += '<div class="td">' + d.summary + '</div>';
    if (meta) h += '<div class="td">' + meta + '</div>';
    if (d.url) h += '<div class="tl"><a href="' + d.url + '" target="_blank">' + (d.linkLabel || 'Open in Jira') + ' →</a></div>';
    tip.innerHTML = h;
    tip.style.display = 'block';
  }
  tip.addEventListener('click', e => e.stopPropagation());
  document.addEventListener('click', () => { if (pinned) { pinned = false; pk = null; tip.style.display = 'none'; tip.style.pointerEvents = ''; } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { pinned = false; pk = null; tip.style.display = 'none'; tip.style.pointerEvents = ''; } });

  function attachTooltips(root) {
    const els = root.querySelectorAll ? [...root.querySelectorAll('.wip-card, .tt')] : [];
    if (root.matches && root.matches('.wip-card, .tt')) els.push(root);
    els.forEach(g => {
      if (g.__ttBound) return;
      g.__ttBound = true;
      g.style.cursor = 'pointer';
      g.addEventListener('mouseenter', e => { if (!pinned) showTip(e.currentTarget); });
      g.addEventListener('mousemove', e => { if (!pinned) { tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY - 40) + 'px'; } });
      g.addEventListener('mouseleave', () => { if (!pinned) tip.style.display = 'none'; });
      g.addEventListener('click', e => {
        e.stopPropagation();
        const k = e.currentTarget.dataset.key;
        if (pinned && pk === k) {
          pinned = false; pk = null; tip.style.display = 'none'; tip.style.pointerEvents = '';
        } else {
          pinned = true; pk = k; showTip(e.currentTarget);
          tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY - 40) + 'px'; tip.style.pointerEvents = 'auto';
        }
      });
    });
  }

  function wireNationalDay() {
    const nl = document.querySelector('.nd-label');
    const nt = document.getElementById('nd-tip');
    if (!nl || !nt) return;
    const dd = nt.querySelector('.nd-desc');
    nl.addEventListener('mouseenter', e => {
      const desc = nl.dataset.desc;
      if (!desc) return;
      dd.textContent = desc;
      nt.style.left = (e.clientX + 14) + 'px'; nt.style.top = (e.clientY - 40) + 'px'; nt.style.display = 'block';
    });
    nl.addEventListener('mousemove', e => { nt.style.left = (e.clientX + 14) + 'px'; nt.style.top = (e.clientY - 40) + 'px'; });
    nl.addEventListener('mouseleave', () => { nt.style.display = 'none'; });
  }

  attachTooltips(document.body);
  wireNationalDay();
})();
</script>
</body>
</html>
